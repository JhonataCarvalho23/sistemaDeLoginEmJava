<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova — Criar conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid"></div>
    </div>

    <main class="container">
        <section class="auth-card">

            <div class="brand-section">

                <div class="brand">
                    <div class="brand-icon">N</div>
                    <span>NOVA</span>
                </div>

                <div class="brand-content">
                    <span class="badge">JOIN NOVA</span>

                    <h1>
                        Seu espaço.
                        <br>
                        <span>Sua experiência.</span>
                    </h1>

                    <p>
                        Crie sua conta e comece sua experiência com a Nova.
                    </p>
                </div>

                <div class="decoration">
                    <div class="circle circle-1"></div>
                    <div class="circle circle-2"></div>
                    <div class="circle circle-3"></div>
                </div>

                <div class="brand-footer">
                    <span>SECURE</span>
                    <span class="dot"></span>
                    <span>FAST</span>
                    <span class="dot"></span>
                    <span>SIMPLE</span>
                </div>

            </div>

            <div class="form-section">
                <form id="registerForm" class="auth-form active">

                    <div class="form-header">
                        <span class="mobile-logo">N</span>

                        <h2>Crie sua conta</h2>

                        <p>
                            Comece sua experiência com a Nova.
                        </p>
                    </div>


                    <div class="input-group">
                        <label for="registerName">
                            Nome
                        </label>

                        <div class="input-wrapper">
                            <span class="input-icon">
                                ◇
                            </span>

                            <input
                                type="text"
                                id="registerName"
                                placeholder="Seu nome"
                                autocomplete="name"
                                required
                            >
                        </div>
                    </div>


                    <div class="input-group">
                        <label for="registerEmail">
                            E-mail
                        </label>

                        <div class="input-wrapper">
                            <span class="input-icon">
                                @
                            </span>

                            <input
                                type="email"
                                id="registerEmail"
                                placeholder="seu@email.com"
                                autocomplete="email"
                                required
                            >
                        </div>
                    </div>


                    <div class="input-group">
                        <label for="registerPassword">
                            Senha
                        </label>

                        <div class="input-wrapper">
                            <span class="input-icon">
                                ◆
                            </span>

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Crie uma senha"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="registerPassword"
                            >
                                ◉
                            </button>
                        </div>
                    </div>


                    <div class="password-strength">

                        <div class="strength-bars">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <span id="strengthText">
                            Digite uma senha
                        </span>

                    </div>


                    <label class="terms">
                        <input type="checkbox" required>

                        <span class="custom-checkbox"></span>

                        <span>
                            Eu concordo com os
                            <a href="#">Termos de Uso</a>
                            e
                            <a href="#">Política de Privacidade</a>.
                        </span>
                    </label>


                    <button class="submit-button" type="submit">
                        <span class="button-text">
                            Criar minha conta
                        </span>

                        <span class="loader"></span>

                        <span class="arrow">
                            →
                        </span>
                    </button>


                    <p class="switch-form">
                        Já possui uma conta?

                        <a href="../../index.html" class="switch-link">
                            Fazer login
                        </a>
                    </p>

                </form>
            </div>

        </section>
    </main>

    <div id="toast" class="toast">
        <span id="toastIcon">✓</span>
        <span id="toastMessage">Mensagem</span>
    </div>

    <script src="../js/script.js"></script>

</body>
</html>
